name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Clean & Create Flutter Project
        run: |
          # 既存のlibとpubspecを一時退避
          mkdir -p temp_backup
          if [ -d "lib" ]; then mv lib temp_backup/; fi
          if [ -f "pubspec.yaml" ]; then mv pubspec.yaml temp_backup/; fi
          
          # クリーンな状態でFlutterプロジェクトを新規作成
          flutter create . --org com.example --project-name my_app
          
          # 退避させていたファイルを元に戻す
          rm -rf lib
          mv temp_backup/lib .
          mv temp_backup/pubspec.yaml .
          rm -rf temp_backup
          
          # Gradleのキャッシュや依存関係を綺麗にする
          flutter clean
          flutter pub get

      - name: Build APK (Debug)
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
