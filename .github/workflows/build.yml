name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Create Flutter Project Structure
        run: |
          # 既存のファイル（libとpubspec）を退避させてから正式なプロジェクト構造を作る
          mkdir temp_work
          mv lib temp_work/
          mv pubspec.yaml temp_work/
          
          flutter create . --org com.example --project-name my_app
          
          # 退避させていたファイルを上書き戻しする
          rm -rf lib
          mv temp_work/lib .
          mv temp_work/pubspec.yaml .
          rm -rf temp_work

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (Debug)
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
